// path: android/app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ludamob.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ludamob.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
}
